<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Easy Emails Manager — обслуговування</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1f2633;
      --muted: #5c6678;
      --accent: #0d6efd;
      --accent-soft: rgba(13, 110, 253, 0.12);
      --border: #e2e6ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b22;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #4d94ff;
        --accent-soft: rgba(77, 148, 255, 0.15);
        --border: #2a2f3a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 32px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .icon svg { width: 44px; height: 44px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .icon svg { animation: none; } }
    h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.3; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.55; }
    .message {
      margin: 20px 0 4px;
      padding: 12px 16px;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--text);
      text-align: left;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .footer { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
    .footer span { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
    <h1>Система в режимі обслуговування</h1>
    <p>Зараз проводяться технічні роботи. Усі дії тимчасово недоступні — будь ласка, зайдіть трохи пізніше.</p>
    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}
    <div class="footer"><span></span>Сторінка оновиться автоматично</div>
  </main>
  <script>
    //check every 30s whether maintenance is over (any non-503 answer) and reload the page the user came for
    setInterval(function () {
      fetch(window.location.href, { method: "HEAD", cache: "no-store" })
        .then(function (r) { if (r.status !== 503) window.location.reload(); })
        .catch(function () {});
    }, 30000);
  </script>
</body>
</html>
